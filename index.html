
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samiksha Tripathi - Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Nunito+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* Smooth scrolling for anchor links */
    html {
      scroll-behavior: smooth;
    }
    /* Custom scrollbar for a more modern look (optional) */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1; 
    }
    ::-webkit-scrollbar-thumb {
      background: #888; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #555; 
    }
    .dark ::-webkit-scrollbar-track {
      background: #2d3748; /* dark:bg-gray-700 */
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #718096; /* dark:bg-gray-500 */
    }
    .dark ::-webkit-scrollbar-thumb:hover {
      background: #a0aec0; /* dark:bg-gray-400 */
    }

    /* Fun Mode Styles */
    .fun-mode-active body, .fun-mode-active {
      font-family: 'Press Start 2P', cursive !important; /* Force pixel font */
      background-image: 
        linear-gradient(rgba(180, 255, 180, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(180, 255, 180, 0.07) 1px, transparent 1px);
      background-size: 25px 25px; /* Adjust size of pixel grid */
      background-color: #f0fff0; /* Light minty green for fun mode light */
    }
    .fun-mode-active.dark body, .fun-mode-active.dark {
      background-image: 
        linear-gradient(rgba(80, 150, 80, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(80, 150, 80, 0.12) 1px, transparent 1px);
      background-color: #0A1A0A; /* Darker green for fun mode dark */
    }
    
    .fun-mode-active h1, .fun-mode-active h2, .fun-mode-active h3, .fun-mode-active h4, .fun-mode-active h5, .fun-mode-active h6,
    .fun-mode-active p, .fun-mode-active a, .fun-mode-active span, .fun-mode-active li, .fun-mode-active button, .fun-mode-active input, .fun-mode-active label,
    .fun-mode-active div:not([class*="pixel-"]):not(.pixel-block) { /* Exclude pixel art containers and blocks from this specific rule */
      font-family: 'Press Start 2P', cursive !important;
      line-height: 1.8; /* Adjust line height for pixel font readability */
      text-shadow: 1px 1px 0px rgba(0,0,0,0.15); /* Subtle shadow for pop */
    }

    .fun-mode-active ::-webkit-scrollbar-track {
      background: #d1fae5; /* lighter green */
    }
    .fun-mode-active ::-webkit-scrollbar-thumb {
      background: #a3e635; /* lime-400 */
      border: 2px solid #d1fae5; /* Match track for pop */
      border-radius: 4px;
    }
    .fun-mode-active.dark ::-webkit-scrollbar-track {
      background: #064e3b; /* darker green */
    }
    .fun-mode-active.dark ::-webkit-scrollbar-thumb {
      background: #bef264; /* lime-300 */
      border: 2px solid #064e3b; /* Match track for pop */
      border-radius: 4px;
    }

    /* Pixel Art Base */
    .pixel-block {
      position: absolute;
      width: 5px; /* Base unit for pixel art */
      height: 5px;
      box-shadow: 0 0 0 0.75px rgba(0,0,0,0.25); /* slightly stronger definition */
    }
    .pixel-art-container {
        position: absolute; /* For FunModeElements positioning */
        animation-timing-function: linear; /* Base, can be overridden */
        animation-iteration-count: infinite;
    }

    /* Daisy Flower (.pixel-flower-daisy) */
    .pixel-flower-daisy { width: 40px; height: 55px; animation-name: floatFlower; animation-duration: 20s; }
    .pixel-flower-daisy .center { background-color: #fde047; /* yellow-300 */ top: 15px; left: 15px; width:10px; height:10px; }
    .fun-mode-active.dark .pixel-flower-daisy .center { background-color: #f59e0b; /* amber-500 */ }
    .pixel-flower-daisy .petal { background-color: #fbcfe8; /* pink-200 for lighter fun mode */ width:10px; height:15px;}
    .fun-mode-active.dark .pixel-flower-daisy .petal { background-color: #f472b6; /* pink-400 for darker fun mode contrast */ }
    /* Daisy Petal Positions */
    .pixel-flower-daisy .p1 { top: 0px; left: 15px; } 
    .pixel-flower-daisy .p2 { top: 30px; left: 15px; } 
    .pixel-flower-daisy .p3 { top: 15px; left: 0px; transform: rotate(-90deg); transform-origin: 15px 7.5px;} 
    .pixel-flower-daisy .p4 { top: 15px; left: 30px; transform: rotate(90deg); transform-origin: -5px 7.5px; } 
    .pixel-flower-daisy .p5 { top: 5px; left: 5px; transform: rotate(-45deg); transform-origin: center;} 
    .pixel-flower-daisy .p6 { top: 5px; left: 25px; transform: rotate(45deg); transform-origin: center;} 
    .pixel-flower-daisy .p7 { top: 25px; left: 5px; transform: rotate(-135deg); transform-origin: center;} 
    .pixel-flower-daisy .p8 { top: 25px; left: 25px; transform: rotate(135deg); transform-origin: center;} 

    .pixel-flower-daisy .stem { background-color: #84cc16; /* lime-500 */ top: 40px; left: 17.5px; width:5px; height:15px; }
    .fun-mode-active.dark .pixel-flower-daisy .stem { background-color: #a3e635; /* lime-400 */ }

    /* Tulip Flower (.pixel-flower-tulip) */
    .pixel-flower-tulip { width: 25px; height: 45px; animation-name: floatFlower; animation-duration: 25s; }
    .pixel-flower-tulip .petal { background-color: #f87171; /* red-400 */ width:10px; }
    .fun-mode-active.dark .pixel-flower-tulip .petal { background-color: #ef4444; /* red-500 */ }
    .pixel-flower-tulip .p1 { top:0px; left:7.5px; height:20px; } 
    .pixel-flower-tulip .p2 { top:5px; left:0px; height:18px; transform: rotate(-15deg); } 
    .pixel-flower-tulip .p3 { top:5px; left:15px; height:18px; transform: rotate(15deg); } 
    .pixel-flower-tulip .base { background-color: #fde047; /* yellow-300 */ top:18px; left:5px; width:15px; height:5px; }
    .fun-mode-active.dark .pixel-flower-tulip .base { background-color: #facc15; /* yellow-400 */}
    .pixel-flower-tulip .stem { background-color: #84cc16; /* lime-500 */ top:23px; left:10px; width:5px; height:22px; }
    .fun-mode-active.dark .pixel-flower-tulip .stem { background-color: #a3e635; /* lime-400 */ }

    /* Bunny (.pixel-animal-bunny) */
    .pixel-animal-bunny { width: 35px; height: 50px; animation-name: bounceBunny; animation-duration: 2.5s; }
    .pixel-animal-bunny .pb { background-color: #d1d5db; /* gray-300 */ } 
    .fun-mode-active.dark .pixel-animal-bunny .pb { background-color: #6b7280; /* gray-500 */ }
    /* Bunny - Ears */
    .pixel-animal-bunny .earL { top:0; left:5px; width:5px; height:15px; }
    .pixel-animal-bunny .earR { top:0; left:25px; width:5px; height:15px; }
    .pixel-animal-bunny .earL-in { top:5px; left:5px; width:5px; height:10px; background-color: #fbcfe8; /* pink-200 */}
    .pixel-animal-bunny .earR-in { top:5px; left:25px; width:5px; height:10px; background-color: #fbcfe8; }
    .fun-mode-active.dark .pixel-animal-bunny .earL-in, .fun-mode-active.dark .pixel-animal-bunny .earR-in { background-color: #f472b6; /* pink-400 */}
    /* Bunny - Head */
    .pixel-animal-bunny .head1 { top:10px; left:0px; width:35px; height:5px;}
    .pixel-animal-bunny .head2 { top:15px; left:5px; width:25px; height:10px;}
    .pixel-animal-bunny .eyeL { top:15px; left:10px; background-color:#f87171; /* red-400 */}
    .pixel-animal-bunny .eyeR { top:15px; left:20px; background-color:#f87171; }
    .fun-mode-active.dark .pixel-animal-bunny .eyeL, .fun-mode-active.dark .pixel-animal-bunny .eyeR { background-color: #ef4444; }
    .pixel-animal-bunny .nose { top:20px; left:15px; background-color:#f472b6; /* pink-400 */}
    .fun-mode-active.dark .pixel-animal-bunny .nose { background-color: #ec4899; /* pink-500 */}
    /* Bunny - Body */
    .pixel-animal-bunny .body1 { top:25px; left:5px; width:25px; height:15px;}
    .pixel-animal-bunny .footL { top:40px; left:5px; width:10px; height:5px;}
    .pixel-animal-bunny .footR { top:40px; left:20px; width:10px; height:5px;}
    .pixel-animal-bunny .tail { top:35px; left:0px; width:5px; height:5px; border-radius:2.5px;}
    
    /* Bird (.pixel-animal-bird) */
    .pixel-animal-bird { width:40px; height:30px; animation-name: flutterBird; animation-duration:3.5s; }
    .pixel-animal-bird .pab { background-color: #60a5fa; /* blue-400 */ } 
    .fun-mode-active.dark .pixel-animal-bird .pab { background-color: #3b82f6; /* blue-500 */ }
    /* Bird - Body & Head */
    .pixel-animal-bird .body { top:5px; left:5px; width:25px; height:15px; border-radius: 5px 5px 2.5px 2.5px;}
    .pixel-animal-bird .head { top:0px; left:20px; width:10px; height:10px; border-radius: 5px 5px 0 0;}
    .pixel-animal-bird .eye { top:5px; left:25px; width:5px; height:5px; background-color: #fef9c3; border-radius: 2.5px; } /* yellow-100 */
    .fun-mode-active.dark .pixel-animal-bird .eye { background-color: #fde047; } /* yellow-300 */
    .pixel-animal-bird .beak { top:5px; left:30px; width:10px; height:5px; background-color: #fbbf24; /* amber-400 */ border-radius: 0 2.5px 2.5px 0;}
    .fun-mode-active.dark .pixel-animal-bird .beak { background-color: #f59e0b; /* amber-500 */ }
    /* Bird - Wing */
    .pixel-animal-bird .wing { top:10px; left:0px; width:20px; height:10px; background-color: #93c5fd; /* blue-300 */ transform-origin: right center; animation: flapWing 0.6s ease-in-out infinite alternate; border-radius: 5px 0 0 5px;}
    .fun-mode-active.dark .pixel-animal-bird .wing { background-color: #60a5fa; /* blue-400 */ }
    /* Bird - Tail */
    .pixel-animal-bird .tail { top:15px; left:30px; width:10px; height:10px; background-color: #93c5fd; border-radius: 0 5px 5px 0;}
    .fun-mode-active.dark .pixel-animal-bird .tail { background-color: #60a5fa; }

    @keyframes floatFlower {
      0% { transform: translateY(0px) translateX(0px) rotate(0deg) scale(1) ; opacity: 0.85; }
      20% { transform: translateY(-20px) translateX(10px) rotate(-5deg) scale(1.05); opacity: 1; }
      40% { transform: translateY(-5px) translateX(-12px) rotate(3deg) scale(1); opacity: 0.9; }
      60% { transform: translateY(-25px) translateX(8px) rotate(10deg) scale(1.1); opacity: 1; }
      80% { transform: translateY(-10px) translateX(-8px) rotate(-7deg) scale(1.02); opacity: 0.95; }
      100% { transform: translateY(0px) translateX(0px) rotate(0deg) scale(1); opacity: 0.85; }
    }
    @keyframes bounceBunny {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); animation-timing-function: ease-out; }
      25% { transform: translateY(-20px) rotate(5deg) scale(1.05); animation-timing-function: ease-in; }
      50% { transform: translateY(0px) rotate(-3deg) scale(1); animation-timing-function: ease-out; }
      75% { transform: translateY(-15px) rotate(-6deg) scale(1.03); animation-timing-function: ease-in; }
    }
    @keyframes flutterBird {
      0% { transform: translateY(0px) translateX(0px) scale(1) rotate(0deg); }
      25% { transform: translateY(-8px) translateX(4px) scale(1.03) rotate(2deg); }
      50% { transform: translateY(-2px) translateX(-3px) scale(1) rotate(-1deg); }
      75% { transform: translateY(-10px) translateX(2px) scale(1.05) rotate(3deg); }
      100% { transform: translateY(0px) translateX(0px) scale(1) rotate(0deg); }
    }
    @keyframes flapWing {
        0% { transform: rotate(-15deg) scaleY(1.05); }
        100% { transform: rotate(15deg) scaleY(0.9); }
    }

  </style>

</script>
